import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their MD5 checksums.
        // NOTE(fork): pointed at a self-built libmpv which carries the
        // `ao=audiotrack` multi-instance JNI fix (mpv 46fe3cded0) backported
        // onto the pinned media-kit revision. Consumed by Aves via a
        // `dependency_overrides` entry, see Y-Yes/libmpv-android-video-build.
        def filesToDownload = [
            ["url": "https://github.com/Y-Yes/libmpv-android-video-build/releases/download/vnext/default-arm64-v8a.jar", "md5": "673ac80f4a846a5b934edeb6d361afa3", "destination": file("$buildDir/vnext/default-arm64-v8a.jar")],
            ["url": "https://github.com/Y-Yes/libmpv-android-video-build/releases/download/vnext/default-armeabi-v7a.jar", "md5": "29bd84290eaa50e8f7508b82b84fe7e2", "destination": file("$buildDir/vnext/default-armeabi-v7a.jar")],
            ["url": "https://github.com/Y-Yes/libmpv-android-video-build/releases/download/vnext/default-x86_64.jar", "md5": "81a544d1230c06b27a02c566af31f602", "destination": file("$buildDir/vnext/default-x86_64.jar")],
            ["url": "https://github.com/Y-Yes/libmpv-android-video-build/releases/download/vnext/default-x86.jar", "md5": "e963a73372847cc9f0f01ca8f00d8b58", "destination": file("$buildDir/vnext/default-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedMD5 != fileInfo.md5) {
                    destFile.delete()
                    println "MD5 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedMD5 != fileInfo.md5) {
                    throw new GradleException("MD5 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)